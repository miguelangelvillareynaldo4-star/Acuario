name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Build-Tools
        run: |
          sdkmanager --install "build-tools;33.0.2" "build-tools;37.0.0" "platform-tools" "platforms;android-33"
          sdkmanager --licenses || true
          mkdir -p $HOME/.buildozer/android/platform/
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -sfn $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk
          ls $ANDROID_HOME/build-tools/
          ls $ANDROID_HOME/build-tools/37.0.0/ | grep aidl
      - name: Install Python deps
        run: |
          pip3 install --upgrade pip
          pip3 install cython==0.29.36 buildozer
      - name: Build APK
        run: |
          export P4A_NUM_JOBS=1
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioApp-APK
          path: bin/*.apk

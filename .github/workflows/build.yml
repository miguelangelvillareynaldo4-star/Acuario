name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libbz2-dev libsqlite3-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Añadir pip al PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Limpiar compilaciones anteriores
        run: |
          rm -rf .buildozer bin || true

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: acuarioapp-apk
          path: bin/*.apk
        

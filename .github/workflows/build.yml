name: Compilar APK con Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        check-latest: true

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache lld libltdl-dev

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install --user cython==0.29.36
        pip install --user buildozer

    - name: Añadir pip al PATH
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Limpiar compilaciones anteriores
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Compilar APK con Buildozer
      run: |
        export PATH=$PATH:$HOME/.local/bin
        export JAVA_HOME=$JAVA_HOME_17_X64
        buildozer -v android debug

    - name: Guardar APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-acuario-debug
        path: bin/*.apk
        

name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools zip unzip openjdk-17-jdk libffi-dev libssl-dev libsqlite3-dev libbz2-dev
          pip3 install --upgrade pip
          pip3 install "cython==0.29.36" buildozer
      - name: Build APK
        run: |
          yes | buildozer android debug || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioApp-APK
          path: bin/*.apk
          if-no-files-found: error

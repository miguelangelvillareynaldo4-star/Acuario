name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install cython==0.29.36 buildozer
      - name: Build APK
        run: |
          export P4A_NUM_JOBS=1
          # 1er intento baja el SDK (va a fallar pero baja el sdkmanager)
          buildozer android debug || true
          # 2do aceptamos licencias del SDK que acaba de bajar
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager -type f | head -1)
          echo "Encontrado sdkmanager en: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.[STRIPPED 71 bytes]"d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.[STRIPPED 71 bytes]"24333f8a63b6825ea9c5514f83c1059f716d6fb" >> ~/.[STRIPPED 67 bytes]
          # 3er intento ya sí compila completo
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AcuarioApp-APK
          path: bin/*.apk

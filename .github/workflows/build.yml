name: Compilar APK con Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Limpiar compilaciones anteriores
        run: |
          rm -rf bin .buildozer/applibs || true

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libblas-dev liblapack-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install --user cython==0.29.37
          pip install --user buildozer

      - name: Instalar Android SDK Command-line Tools y Licencias
        run: |
          ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools cmdline-tools.zip
          
          # Fix para Buildozer viejo que busca en tools/bin
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$HOME/.local/bin" >> $GITHUB_PATH

          yes | $ANDRID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/lastest/bin/sdkmanager "build-tools;33.0.3" "platforms;android-33" "platform-tools" "ndk;28c"

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: acuarioapp-apk
          path: bin/*.apk

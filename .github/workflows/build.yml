name: Compilar APK con Buildozer
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Limpiar compilaciones anteriores
        run: rm -rf bin .buildozer/applibs || true

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zip unzip libffi-dev libssl-dev python3-dev libjpeg-dev zlib1g-dev

      - name: Instalar Buildozer y Cython
        run: |
          python3 -m pip install --upgrade pip --user
          python3 -m pip install --user cython==0.29.37 buildozer

      - name: Instalar Android SDK Command-line Tools y Licencias
        run: |
          ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $ANDROID_HOME/cmdline-tools
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ 2>/dev/null || mv cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest 2>/dev/null || true
          rm -rf cmdline-tools tools.zip
          chmod +x $ANDROID_HOME/cmdline-tools/latest/bin/*
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$HOME/.local/bin" >> $GITHUB_PATH
          sdkmanager --version
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;33.0.3" "platforms;android-33" "platform-tools" 

      - name: Compilar APK con Buildozer
        run: |
          export PATH=$HOME/.local/bin:$PATH
          buildozer -v android debug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: acuarioapp-apk
          path: bin/*.apk

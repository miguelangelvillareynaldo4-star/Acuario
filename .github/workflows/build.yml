name: Compilar APK con Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libblas-dev liblapack-dev

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Instalar Android SDK Command-line Tools y Licencias
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools/* $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
          rm cmdline-tools.zip
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.3" "platforms;android-33" "platform-tools"

      - name: Limpiar compilaciones anteriores
        run: |
          rm -rf .buildozer bin || true

      - name: Compilar APK con Buildozer
        run: |
          buildozer -v android debug

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v3
        with:
          name: acuarioapp-apk
          path: bin/*.apk
